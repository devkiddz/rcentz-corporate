<svg xmlns="http://www.w3.org/2000/svg" width="720" height="570" viewBox="0 0 720 570" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Rcentz — Connected work, meaningful results</title>
  <desc id="description">Three visual layers show business goals flowing into a designed digital solution, which connects to simpler customer experiences.</desc>
  <defs>
    <linearGradient id="panel" x1="170" y1="100" x2="565" y2="449" gradientUnits="userSpaceOnUse">
      <stop stop-color="#192E4B"/><stop offset=".52" stop-color="#102035"/><stop offset="1" stop-color="#0D182A"/>
    </linearGradient>
    <linearGradient id="blue" x1="260" y1="172" x2="496" y2="386" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E8AFF"/><stop offset="1" stop-color="#0053D6"/>
    </linearGradient>
    <linearGradient id="glow" x1="215" y1="145" x2="610" y2="435" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5DADFF" stop-opacity=".28"/><stop offset="1" stop-color="#006DFD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="80" y1="208" x2="248" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C3553"/><stop offset="1" stop-color="#132239"/>
    </linearGradient>
    <linearGradient id="outcome" x1="456" y1="295" x2="665" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152F50"/><stop offset="1" stop-color="#0F1E31"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(390 289) rotate(90) scale(260 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0075FF" stop-opacity=".19"/><stop offset="1" stop-color="#006DFD" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#79B6FF" fill-opacity=".14"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000817" flood-opacity=".36"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Spatial framework: the artwork is a standalone, static SVG. -->
  <ellipse cx="394" cy="275" rx="287" ry="244" fill="url(#halo)"/>
  <path d="M90 105H672M90 180H672M90 255H672M90 330H672M90 405H672M90 480H672" stroke="#7CA8E4" stroke-opacity=".05"/>
  <path d="M100 60V528M175 60V528M250 60V528M325 60V528M400 60V528M475 60V528M550 60V528M625 60V528" stroke="#7CA8E4" stroke-opacity=".05"/>
  <rect x="52" y="36" width="640" height="489" fill="url(#dot-grid)" opacity=".85"/>
  <ellipse cx="394" cy="466" rx="222" ry="25" fill="#006DFD" opacity=".12" filter="url(#soft)"/>

  <!-- Cross-card data paths -->
  <path d="M172 272H226C246 272 246 293 267 293H289" stroke="#589BFC" stroke-width="1.75" stroke-opacity=".65" stroke-dasharray="4 7"/>
  <path d="M467 317H525C544 317 544 339 559 339" stroke="#589BFC" stroke-width="1.75" stroke-opacity=".58" stroke-dasharray="4 7"/>
  <circle cx="267" cy="293" r="4" fill="#006DFD"/>
  <circle cx="525" cy="317" r="4" fill="#006DFD"/>

  <!-- Architectural foundation -->
  <path d="M168 133L189 115H555L575 133V442L555 460H189L168 442Z" fill="#006DFD" fill-opacity=".08" stroke="#4479B2" stroke-opacity=".18"/>

  <!-- Main solution panel -->
  <g filter="url(#shadow)">
    <rect x="163" y="97" width="410" height="349" rx="23" fill="url(#panel)" stroke="#6EA6E7" stroke-opacity=".35"/>
    <rect x="164" y="98" width="408" height="348" rx="22" stroke="#B5DAFF" stroke-opacity=".07"/>
  </g>
  <path d="M164 153H573" stroke="#B6D6FA" stroke-opacity=".14"/>
  <circle cx="188" cy="125" r="4" fill="#006DFD"/>
  <circle cx="201" cy="125" r="4" fill="#47739B"/>
  <circle cx="214" cy="125" r="4" fill="#47739B"/>
  <text x="238" y="129" fill="#E7F3FF" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">RCENTZ</text>
  <rect x="472" y="113" width="77" height="24" rx="12" fill="#006DFD" fill-opacity=".14" stroke="#69B2FF" stroke-opacity=".23"/>
  <circle cx="484" cy="125" r="3" fill="#74CAFF"/>
  <text x="493" y="128.5" fill="#AED7FF" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="9">LIVE IDEAS</text>

  <text x="195" y="188" fill="#7FB4EE" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="10" letter-spacing="1.5">FROM IDEA TO IMPACT</text>
  <text x="195" y="215" fill="#F6FAFF" font-family="Inter, Arial, sans-serif" font-weight="650" font-size="21">Connected by design.</text>
  <text x="195" y="234" fill="#95ABC5" font-family="Inter, Arial, sans-serif" font-size="11">People, processes and better experiences.</text>

  <!-- Small workflow rail -->
  <rect x="195" y="257" width="346" height="58" rx="13" fill="#091829" stroke="#729FCE" stroke-opacity=".2"/>
  <path d="M262 286H498" stroke="#3B679B" stroke-width="2" stroke-dasharray="3 5"/>
  <circle cx="262" cy="286" r="13" fill="#006DFD"/>
  <circle cx="363" cy="286" r="13" fill="#0C2D57" stroke="#348CEB"/>
  <circle cx="498" cy="286" r="13" fill="#0C2D57" stroke="#348CEB"/>
  <path d="M224 286L228 290L235 282" stroke="#F9FCFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M360 287L363 283L366 287L363 291Z" stroke="#7DC0FF" stroke-width="1.3"/>
  <path d="M495 286L498 283L501 286L498 289Z" stroke="#7DC0FF" stroke-width="1.3"/>
  <text x="262" y="306" fill="#A9D6FF" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="8">DISCOVER</text>
  <text x="363" y="306" fill="#A9D6FF" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="8">BUILD</text>
  <text x="498" y="306" fill="#A9D6FF" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="8">IMPROVE</text>

  <!-- Interface preview within the solution -->
  <rect x="195" y="333" width="346" height="91" rx="13" fill="#102744" stroke="#6299D4" stroke-opacity=".24"/>
  <rect x="209" y="347" width="82" height="62" rx="9" fill="url(#blue)"/>
  <path d="M233 378L245 390L266 367" stroke="#E9F5FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="305" y="360" fill="#A8D6FF" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="9" letter-spacing=".5">PURPOSEFUL SOFTWARE</text>
  <text x="305" y="382" fill="#F2F8FF" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="16">Built for real work</text>
  <rect x="305" y="394" width="130" height="4" rx="2" fill="#41678D"/>
  <rect x="305" y="405" width="88" height="4" rx="2" fill="#31506F"/>

  <!-- Left card: business context -->
  <g filter="url(#shadow)">
    <rect x="33" y="241" width="184" height="143" rx="17" fill="url(#glass)" stroke="#73B1F2" stroke-opacity=".45"/>
  </g>
  <rect x="49" y="256" width="32" height="32" rx="9" fill="#006DFD" fill-opacity=".19" stroke="#61A5FE" stroke-opacity=".3"/>
  <path d="M58 278V268H71M63 275L71 268" stroke="#89C4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="93" y="268" fill="#84BFFF" font-family="Inter, Arial, sans-serif" font-weight="650" font-size="9" letter-spacing=".8">START HERE</text>
  <text x="93" y="284" fill="#F0F7FF" font-family="Inter, Arial, sans-serif" font-weight="650" font-size="12">Your business</text>
  <path d="M49 299H200" stroke="#7AB1E9" stroke-opacity=".17"/>
  <circle cx="57" cy="318" r="3" fill="#4C9EFF"/>
  <text x="70" y="321.5" fill="#C3D8EF" font-family="Inter, Arial, sans-serif" font-size="11">Your goals</text>
  <circle cx="57" cy="339" r="3" fill="#4C9EFF"/>
  <text x="70" y="342.5" fill="#C3D8EF" font-family="Inter, Arial, sans-serif" font-size="11">Your workflow</text>
  <circle cx="57" cy="360" r="3" fill="#4C9EFF"/>
  <text x="70" y="363.5" fill="#C3D8EF" font-family="Inter, Arial, sans-serif" font-size="11">Your customers</text>

  <!-- Right card: customer impact -->
  <g filter="url(#shadow)">
    <rect x="477" y="304" width="215" height="151" rx="17" fill="url(#outcome)" stroke="#7BBDFD" stroke-opacity=".52"/>
  </g>
  <rect x="493" y="321" width="31" height="31" rx="9" fill="#006DFD"/>
  <path d="M500 336L505 341L515 330" stroke="#F8FBFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="535" y="331" fill="#98C7FF" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="9" letter-spacing="1">THE OUTCOME</text>
  <text x="535" y="347" fill="#F2F8FF" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="12">Customer value</text>
  <path d="M493 365H676" stroke="#8AB5E7" stroke-opacity=".18"/>
  <circle cx="501" cy="384" r="4" fill="#3EB899"/>
  <text x="514" y="388" fill="#D6E7F9" font-family="Inter, Arial, sans-serif" font-size="11">Clearer journeys</text>
  <circle cx="501" cy="410" r="4" fill="#3EB899"/>
  <text x="514" y="414" fill="#D6E7F9" font-family="Inter, Arial, sans-serif" font-size="11">Easier interactions</text>
  <circle cx="501" cy="436" r="4" fill="#3EB899"/>
  <text x="514" y="440" fill="#D6E7F9" font-family="Inter, Arial, sans-serif" font-size="11">Smoother operations</text>

  <!-- Final value bar -->
  <g filter="url(#shadow)">
    <rect x="225" y="460" width="278" height="54" rx="12" fill="#112A48" stroke="#5C9EDF" stroke-opacity=".38"/>
  </g>
  <circle cx="252" cy="487" r="10" fill="#006DFD" fill-opacity=".23" stroke="#5EACFF" stroke-opacity=".5"/>
  <path d="M248 487L251 490L257 483" stroke="#9ACFFF" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="273" y="484" fill="#F4F9FF" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="12">Less friction.</text>
  <text x="273" y="499" fill="#8FBFEA" font-family="Inter, Arial, sans-serif" font-size="11">More room to grow.</text>
  <path d="M460 483L466 489L477 478" stroke="#67B6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Final small spatial accents -->
  <circle cx="112" cy="177" r="29" stroke="#2A5FA3" stroke-opacity=".3"/>
  <circle cx="112" cy="177" r="6" fill="#006DFD" fill-opacity=".4"/>
  <path d="M567 94V119M554 106H579" stroke="#5DA5FF" stroke-opacity=".4"/>
  <path d="M95 456L107 444L119 456L107 468Z" stroke="#3B81D0" stroke-opacity=".34"/>
  <circle cx="621" cy="165" r="7" fill="#006DFD" fill-opacity=".4"/>
  <circle cx="641" cy="186" r="2" fill="#93C8FF" fill-opacity=".55"/>
</svg>
